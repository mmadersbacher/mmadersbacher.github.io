name: Publish GitHub Pages redirect

# The site itself now lives on Cloudflare Workers (see deploy.yml). GitHub Pages
# only keeps serving a stub that forwards mmadersbacher.github.io/* to the same
# path on gig-gehacktistgeil.com, so old links keep working.

# Deliberately manual. Publishing the stub points the old host at the new domain,
# so it must not run until gig-gehacktistgeil.com is actually serving — otherwise
# mmadersbacher.github.io forwards visitors into a dead domain. Run it by hand
# once after the custom domain is live, and again if the stub ever changes.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Assemble redirect site
        run: |
          mkdir -p _site
          cp tools/gh-pages-redirect/index.html _site/index.html
          # 404.html is what catches deep paths such as /writeups/foo/ and lets
          # the inline script forward the full path to the new domain.
          cp tools/gh-pages-redirect/index.html _site/404.html
          touch _site/.nojekyll

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
