name: Deploy personal site (GitHub Pages)

# mmadersbacher.github.io serves the personal site in `site/`: facts in
# `site/data.json`, rendered to `site/index.html` by `site/build.mjs` (no
# dependencies). The CTF-team site is a separate deployment (see deploy.yml →
# Cloudflare Workers) and is untouched by this workflow.

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never cancel an in-flight Pages deploy; let it finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # Render data.json → index.html, then run the offline checks (facts
      # shape, forbidden strings, escaping, size budget, contrast). A red run
      # here means the page would have shipped something wrong.
      - name: Build
        run: node site/build.mjs

      - name: Test
        run: node --test site/test.mjs

      - name: Upload site/ as Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
