<!doctype html>
<!-- Source of site/og.png (link preview). Render with tools/render-og.sh
     (renders taller and crops; a 630px-high headless window clips the footer). -->
<html lang="en"><head><meta charset="utf-8">
<style>
  @font-face{font-family:"Martian Mono";font-weight:400 800;src:url(../site/fonts/MartianMono-latin.woff2) format("woff2")}
  @font-face{font-family:"Spline Sans Mono";font-weight:300 700;src:url(../site/fonts/SplineSansMono-latin.woff2) format("woff2")}
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1200px;height:630px;overflow:hidden}
  body{background:#101011;color:#e9e6df; font-family:"Spline Sans Mono",monospace;
    padding:62px 84px 58px; display:flex; flex-direction:column; justify-content:space-between}
  .top{display:flex; justify-content:space-between; align-items:flex-start; font-size:19px; color:#85827a}
  .top .m{width:34px;height:9px;background:#e9e6df;display:inline-block;vertical-align:middle;margin-right:2px}
  .kick{font-family:"Martian Mono",monospace; font-size:19px; letter-spacing:.02em; color:#9d9a92}
  h1{font-family:"Martian Mono",monospace; font-weight:600; font-size:86px; line-height:.98; letter-spacing:-.05em; margin-top:18px}
  .tag{font-size:28px; color:#9d9a92; margin-top:26px; letter-spacing:-.01em}
  .tag b{color:#e9e6df; font-weight:500}
  .foot{display:flex; justify-content:space-between; align-items:baseline; font-size:19px; color:#85827a; border-top:1px solid #232320; padding-top:18px}
  .foot .u{color:#9d9a92}
</style></head>
<body>
  <div class="top">
    <span><span class="m"></span></span>
    <span class="kick">Security researcher and web penetration tester</span>
  </div>
  <div>
    <h1>Mario<br>Madersbacher</h1>
    <div class="tag"><b>3 CVEs</b> and <b>12</b> merged upstream pull requests.</div>
  </div>
  <div class="foot">
    <span class="u">mmadersbacher.github.io</span>
    <span>anchorme, nodemailer, impacket, scapy, volatility, ffuf</span>
  </div>
</body></html>
