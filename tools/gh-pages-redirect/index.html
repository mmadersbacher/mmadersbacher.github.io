<!doctype html>
<!--
  Redirect stub published to GitHub Pages after the site moved to
  https://gig-gehacktistgeil.com/ (Cloudflare Workers).

  A *.github.io host has no server config and cannot sit behind Cloudflare, so a
  real 301 is not available here. The inline script runs during head parsing and
  wins the race against the <meta refresh>, which is the no-JS fallback. Google
  treats both as redirect signals and follows the rel=canonical.

  This same file is also published as 404.html, which is what makes deep links
  like /writeups/foo/ carry their path across to the new domain.
-->
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Gehackt ist Geil — neue Adresse</title>
    <link rel="canonical" href="https://gig-gehacktistgeil.com/" />
    <script>
      location.replace(
        "https://gig-gehacktistgeil.com" +
          location.pathname +
          location.search +
          location.hash
      );
    </script>
    <meta http-equiv="refresh" content="0; url=https://gig-gehacktistgeil.com/" />
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #ece3ce;
        color: #1a1a1a;
        font: 16px/1.6 "IBM Plex Mono", ui-monospace, monospace;
        text-align: center;
        padding: 2rem;
      }
      a {
        color: #1a1a1a;
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <p>
      «Gehackt ist Geil» ist umgezogen auf<br />
      <a href="https://gig-gehacktistgeil.com/">gig-gehacktistgeil.com</a>
    </p>
  </body>
</html>
